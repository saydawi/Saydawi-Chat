<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* M3 Expressive Styles */
        :root { --primary: #6366f1; } /* Indigo 500 */
        .msg-anim { animation: slideUp 0.4s cubic-bezier(0.2, 0, 0, 1) forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        body { background-color: #f8fafc; color: #1e293b; }
    </style>
</head>
<body class="h-screen font-sans">

<!-- Login -->
<div id="login-view" class="h-full flex items-center justify-center p-6">
    <div class="bg-white p-10 rounded-[32px] shadow-xl w-full max-w-sm text-center border border-slate-100">
        <div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6 text-indigo-600 text-3xl">💬</div>
        <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Saydawi Chat</h2>
        <p class="text-slate-500 mb-8">Connect expressively.</p>
        <input id="username" placeholder="Enter username" class="w-full p-4 mb-4 bg-slate-100 rounded-full outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="login()" class="w-full bg-indigo-600 text-white p-4 rounded-full font-bold shadow-lg hover:bg-indigo-700 transition">Get Started</button>
    </div>
</div>

<!-- Chat View -->
<div id="chat-view" class="hidden h-full flex p-6 gap-6">
    <!-- Sidebar -->
    <div class="w-1/4 bg-white rounded-[32px] p-8 shadow-sm border border-slate-100 flex flex-col">
        <h2 class="font-bold text-lg mb-6 text-slate-800">Groups</h2>
        <input id="group-name" placeholder="Room Name" class="w-full p-3 mb-2 bg-slate-100 rounded-xl outline-none">
        <button onclick="joinGroup()" class="w-full bg-slate-900 text-white p-3 rounded-xl mb-10 hover:bg-black transition">Create/Join</button>
        
        <h2 class="font-bold text-lg mb-4 text-slate-800">Online</h2>
        <ul id="user-list" class="space-y-3 flex-1 overflow-y-auto"></ul>
    </div>

    <!-- Main -->
    <div class="flex-1 bg-white rounded-[32px] shadow-sm border border-slate-100 flex flex-col p-6">
        <div id="messages" class="flex-1 overflow-y-auto space-y-4 pr-2"></div>
        <form id="form" class="flex gap-3 mt-6 items-center bg-slate-100 p-2 rounded-full">
            <input id="input" class="flex-1 p-3 bg-transparent outline-none px-4" placeholder="Type a message...">
            <input type="file" id="fileInput" class="hidden">
            <label for="fileInput" class="cursor-pointer p-3 bg-white rounded-full shadow-sm hover:bg-slate-50 transition">📎</label>
            <button class="bg-indigo-600 text-white px-8 py-3 rounded-full font-bold shadow-md hover:bg-indigo-700 transition">Send</button>
        </form>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentUser = '', currentRoom = '';

    function login() {
        currentUser = document.getElementById('username').value;
        if(currentUser) {
            socket.emit('login', currentUser);
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');
        }
    }

    function joinGroup() {
        currentRoom = document.getElementById('group-name').value;
        socket.emit('join', currentRoom);
    }

    document.getElementById('form').onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('input');
        const file = document.getElementById('fileInput').files[0];

        if(file) {
            const fd = new FormData(); fd.append('file', file);
            const res = await fetch('/upload', {method:'POST', body:fd});
            const data = await res.json();
            socket.emit('chat message', { user: currentUser, text: `<a href="${data.fileUrl}" target="_blank" class="text-indigo-600 font-bold underline">📎 ${data.fileName}</a>`, room: currentRoom });
            document.getElementById('fileInput').value = '';
        } else if(input.value) {
            socket.emit('chat message', { user: currentUser, text: input.value, room: currentRoom });
            input.value = '';
        }
    };

    socket.on('chat message', (data) => {
        const div = document.createElement('div');
        div.className = `msg-anim p-4 rounded-3xl max-w-[70%] ${data.user === currentUser ? 'bg-indigo-600 text-white ml-auto' : 'bg-slate-100 text-slate-800'}`;
        div.innerHTML = `<p class="text-xs opacity-70 mb-1">${data.user}</p><p class="text-lg">${data.text}</p>`;
        document.getElementById('messages').appendChild(div);
        div.scrollIntoView();
    });

    socket.on('updateUserList', (users) => {
        document.getElementById('user-list').innerHTML = users.filter(u => u !== currentUser).map(u => 
            `<li onclick="startPrivateChat('${u}')" class="p-3 bg-slate-50 rounded-xl cursor-pointer hover:bg-indigo-50 border border-slate-100 transition">👤 ${u}</li>`
        ).join('');
    });

    function startPrivateChat(targetUser) {
        currentRoom = [currentUser, targetUser].sort().join('_');
        socket.emit('join', currentRoom);
        alert('Switched to private chat with ' + targetUser);
    }
</script>
</body>
</html>
